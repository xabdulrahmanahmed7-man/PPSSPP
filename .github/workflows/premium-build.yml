      - name: Setup JDK
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Assemble APK
        run: ./gradlew assembleNormalOptimized --stacktrace

      - name: Package build
        run: |
          mkdir premium
          find . -name "*.apk" -path "*ormal*" -exec cp {} premium/ \;
          ls -la premium

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ppsspp-premium-apk
          path: premium/
