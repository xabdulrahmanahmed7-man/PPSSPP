name: Build PPSSPP Premium APK

# Run it from the Actions tab: "Build PPSSPP Premium APK" > Run workflow.
# It applies the Premium UI patch to this fork's code, builds the app and
# uploads the APK as an artifact. Installs side by side with the original
# PPSSPP (package name org.ppsspp.premium).

on:
  workflow_dispatch:

jobs:
  apk:
    name: Build Premium APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch upstream tags (needed for the version name)
        shell: bash
        run: |
          if [ "0" = "0" ]; then
            git remote add upstream https://github.com/hrydgard/ppsspp.git
            git fetch --deepen=15000 --no-recurse-submodules --tags --force upstream || true
          fi

